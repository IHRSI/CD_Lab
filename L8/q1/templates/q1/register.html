<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Q1</title>
    <link rel="stylesheet" href="/static/css/q1.css">
</head>
<body>
    <div class="container q1-container">
        <h1>Register</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">{{ form.username.label }} <span class="required">*</span></label>
                {{ form.username }}
                {% if form.username.errors %}
                    <span class="error">{{ form.username.errors }}</span>
                {% endif %}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                {{ form.password }}
            </div>

            <div class="form-group">
                <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
                {{ form.email }}
            </div>

            <div class="form-group">
                <label for="{{ form.contact.id_for_label }}">{{ form.contact.label }}</label>
                {{ form.contact }}
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>
</body>
</html>
