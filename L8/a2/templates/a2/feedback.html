<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coursework Feedback Form - A2</title>
    <link rel="stylesheet" href="/static/css/a2.css">
</head>
<body>
    <div class="container a2-container">
        <h1>Coursework Feedback Form</h1>
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="{{ form.student_name.id_for_label }}">{{ form.student_name.label }}</label>
                {{ form.student_name }}
            </div>

            <div class="form-group">
                <label for="{{ form.gender.id_for_label }}">{{ form.gender.label }}</label>
                {{ form.gender }}
            </div>

            <div class="form-group">
                <label for="{{ form.course.id_for_label }}">{{ form.course.label }}</label>
                {{ form.course }}
            </div>

            <div class="form-group">
                <label for="{{ form.suggestion.id_for_label }}">{{ form.suggestion.label }}</label>
                {{ form.suggestion }}
            </div>

            <button type="submit" class="btn-submit">Submit Form</button>
        </form>
    </div>
</body>
</html>
